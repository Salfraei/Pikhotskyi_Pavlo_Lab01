[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.1.0"
requires-python = ">=3.11"
description = "Scientific experiments laboratory project, variant 15"
readme = "README.md"
authors = [{name = "Піхоцький Павло"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "pytest-asyncio>=0.23,<2"]

[project.scripts]
student-manager = "student_manager.main:main"
experiments = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
markers = ["integration: integration tests for the scientific experiment project"]
