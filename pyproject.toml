[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pikhotskyi-student-manager"
version = "0.1.0"
description = "Laboratory 1, Professional Python: educational student manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Піхоцький Павло"}]
dependencies = []

[project.scripts]
student-manager = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
