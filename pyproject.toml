[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikhotskyi-prof-python-lab01-v15"
version = "0.1.1"
requires-python = ">=3.11"
description = "Professional Python cumulative labs 01-01, scientific experiments, variant 15"
readme = "README.md"
authors = [{name = "Піхоцький Павло"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "pytest-asyncio>=0.23,<2"]

[project.scripts]
experiments = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
markers = ["integration: integration tests for the scientific experiment project"]
